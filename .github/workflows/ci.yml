name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyflakes
      - run: pyflakes scripts/
      - run: python3 scripts/validate_dataset.py
      - run: python3 scripts/baseline.py
      - run: python3 scripts/prepare_mlx_data.py
      - run: ./tests/test_script_safety.sh
